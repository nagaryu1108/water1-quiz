<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d4ed8"><link rel="manifest" href="./manifest.webmanifest"><title>水質第1種 問題演習</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:720px;margin:auto;padding:16px}.head{background:#163b73;color:#fff;padding:18px;border-radius:16px;margin-bottom:12px}.head h1{font-size:20px;margin:0 0 7px}.stats{font-size:13px;opacity:.95}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 14px #00000012}.subject{font-size:13px;font-weight:700;color:#1d4ed8}.qno{font-size:12px;color:#64748b;margin-left:8px}.question{font-size:17px;line-height:1.75;font-weight:700;margin:13px 0}.choice{width:100%;text-align:left;background:#fff;border:2px solid #dbe3ee;border-radius:13px;padding:13px;margin:6px 0;font-size:15px;line-height:1.55;color:#172033}.choice.correct{border-color:#16a34a;background:#ecfdf3}.choice.wrong{border-color:#dc2626;background:#fff1f2}.tag{font-weight:800;margin-left:7px}.ok{color:#15803d}.ng{color:#b91c1c}.detail{display:none;background:#f8fafc;border-left:4px solid #94a3b8;margin:-3px 4px 8px;padding:10px 12px;font-size:14px;line-height:1.65}.result{display:none;margin-top:14px;padding:14px;border-radius:12px;background:#f1f5f9;line-height:1.7}.next{display:none;width:100%;border:0;border-radius:12px;padding:14px;margin-top:12px;background:#1d4ed8;color:#fff;font-size:16px;font-weight:800}.note{font-size:12px;color:#64748b;margin-top:12px}.bar{height:7px;background:#dbe3ee;border-radius:9px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:#60a5fa;width:0}.tools{display:flex;gap:7px;margin:10px 0}.tools button{flex:1;border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:9px;font-size:12px}</style></head><body><main class="wrap"><header class="head"><h1>公害防止管理者 水質第1種</h1><div class="stats" id="stats">読み込み中…</div><div class="bar"><i id="bar"></i></div></header><div class="tools"><button id="shuffle">ランダム出題</button><button id="wrongOnly">誤答を復習</button><button id="reset">履歴リセット</button></div><section class="card"><div><span class="subject" id="subject"></span><span class="qno" id="qno"></span></div><div class="question" id="question"></div><div id="choices"></div><div class="result" id="result"></div><button class="next" id="next">次の問題へ</button><div class="note">回答直後に端末内へ自動保存します。回答後は各選択肢をもう一度タップすると、その直下に個別解説が開きます。</div></section></main><script>var B=[['公害総論','環境基準','人の健康を保護し、生活環境を保全する上で維持されることが望ましい行政上の目標値。'],['公害総論','排水基準','水質汚濁防止法に基づき、特定事業場から公共用水域へ排出される排出水に適用される基準。'],['公害総論','上乗せ排水基準','国の一律排水基準だけでは水質保全が困難な水域について、都道府県が条例でより厳しく定める基準。'],['公害総論','特定施設','汚水又は廃液を排出する施設で、政令により指定されたもの。'],['公害総論','総量規制','濃度だけでなく、指定地域内の一定規模以上の事業場について汚濁負荷量を規制する制度。'],['水質概論','BOD','好気性微生物が有機物を分解するときに消費する溶存酸素量を指標とした有機汚濁の尺度。'],['水質概論','COD','酸化剤によって水中の被酸化性物質を化学的に酸化するときの酸素相当量。'],['水質概論','DO','水中に溶解している分子状酸素の濃度。'],['水質概論','富栄養化','窒素・りんなどの栄養塩が増加し、植物プランクトン等の生産が過度に高まる現象。'],['水質概論','青潮','底層の無酸素水塊が湧昇し、硫化物を含む水が表層に現れて海面が青白く見える現象。'],['汚水処理特論','活性汚泥法','微生物フロックを含む活性汚泥と汚水を曝気混合し、有機物を生物学的に除去する処理法。'],['汚水処理特論','SVI','活性汚泥1gが30分静置後に占める体積をmLで表した沈降性の指標。'],['汚水処理特論','SRT','処理系内に微生物・汚泥が平均して滞留する時間。硝化菌の維持などに重要。'],['汚水処理特論','F/M比','流入する有機物負荷量を曝気槽内の微生物量で除した運転管理指標。'],['汚水処理特論','脱窒','無酸素条件で硝酸・亜硝酸態窒素を電子受容体として利用し、主として窒素ガスへ還元する生物反応。'],['水質有害物質特論','ICP-MS','誘導結合プラズマで試料をイオン化し、質量分析計で元素・同位体を高感度測定する方法。'],['水質有害物質特論','原子吸光光度法','基底状態原子による元素固有波長の光吸収を測定して元素を定量する方法。'],['水質有害物質特論','内部標準法','一定量の標準物質を試料と標準液に加え、目的成分との信号比を用いて変動を補正する定量法。'],['水質有害物質特論','添加回収試験','試料へ既知量の対象成分を添加し、前処理・測定後の回収率からマトリックス影響等を確認する品質管理。'],['水質有害物質特論','マトリックス効果','共存成分によって目的成分の抽出、イオン化、吸光などの応答が変化する現象。'],['大規模水質特論','内部負荷','底泥など水域内部に蓄積された物質が再溶出・巻き上げ等で水中へ供給される負荷。'],['大規模水質特論','温度成層','水温差に伴う密度差によって水塊が鉛直方向に混合しにくい層構造を形成する現象。'],['大規模水質特論','躍層','水温や密度などが鉛直方向に急激に変化する層。上下層間の混合を妨げる。'],['大規模水質特論','底層貧酸素化','成層等で酸素供給が制限される一方、有機物分解で酸素が消費され、底層のDOが低下する現象。'],['大規模水質特論','クロロフィルa','植物プランクトン現存量の概略指標として水質調査で広く用いられる光合成色素。']];var Q=[];function build(){for(var r=0;r<4;r++){for(var i=0;i<B.length;i++){var x=B[i],opts=[],ans;if(r%2===0){opts.push(x[2]);ans=0;for(var k=1;k<5;k++)opts.push(B[(i+k*3)%B.length][2]);Q.push({s:x[0],q:'「'+x[1]+'」の説明として最も適当なものはどれか。',o:opts,a:ans,e:x[1]+'：'+x[2]});}else{opts.push(x[1]);ans=0;for(var j=1;j<5;j++)opts.push(B[(i+j*4)%B.length][1]);Q.push({s:x[0],q:'次の説明に該当する用語として最も適当なものはどれか。\n「'+x[2]+'」',o:opts,a:ans,e:'正答は「'+x[1]+'」。'+x[2]});}}}}function mix(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a}build();var key='water1_pages_v1',st={idx:0,order:[],hist:{},correct:0,attempts:0,mode:'all'};try{var z=JSON.parse(localStorage.getItem(key));if(z)st=z}catch(e){}if(!st.order||!st.order.length){st.order=mix(Q.map(function(_,i){return i}))}function save(){try{localStorage.setItem(key,JSON.stringify(st))}catch(e){}}function currentId(){if(st.mode==='wrong'){var w=Object.keys(st.hist).filter(function(k){return st.hist[k].wrong>0}).map(Number);if(w.length)return w[st.idx%w.length]}return st.order[st.idx%st.order.length]}function render(){var id=currentId(),q=Q[id],answered=false,h=st.hist[id];document.getElementById('subject').textContent=q.s;document.getElementById('qno').textContent='問題 '+(st.idx+1)+' / '+Q.length;document.getElementById('question').textContent=q.q;var c=document.getElementById('choices');c.innerHTML='';q.o.forEach(function(txt,n){var b=document.createElement('button');b.className='choice';b.textContent=(n+1)+'. '+txt;b.onclick=function(){pick(id,n,b)};c.appendChild(b);var d=document.createElement('div');d.className='detail';d.id='d'+n;d.textContent=n===q.a?'この選択肢が正解です。'+q.e:'この選択肢は誤りです。正答のポイント：'+q.e;c.appendChild(d)});document.getElementById('result').style.display='none';document.getElementById('next').style.display='none';update()}function pick(id,n,b){var q=Q[id],h=st.hist[id];if(h&&h.answered){var d=document.getElementById('d'+n);d.style.display=d.style.display==='block'?'none':'block';return}var ok=n===q.a;st.hist[id]={answered:true,selected:n,wrong:ok?0:1};st.attempts++;if(ok)st.correct++;save();var buttons=document.querySelectorAll('.choice');buttons[q.a].classList.add('correct');buttons[q.a].innerHTML+=' <span class="tag ok">✓ 正解</span>';if(!ok){buttons[n].classList.add('wrong');buttons[n].innerHTML+=' <span class="tag ng">✕ あなたの回答</span>'}var r=document.getElementById('result');r.style.display='block';r.innerHTML='<b class="'+(ok?'ok':'ng')+'">'+(ok?'✓ 正解':'✕ 不正解')+'</b><br>正答：'+(q.a+1)+'<br><br>'+q.e+'<br><small>試験対策：用語名だけでなく、定義・原理・似た概念との違いをセットで確認してください。</small>';document.getElementById('next').style.display='block';update()}function update(){document.getElementById('stats').textContent='解答 '+st.attempts+'問　正解 '+st.correct+'問　正答率 '+(st.attempts?Math.round(st.correct/st.attempts*100):0)+'%　｜ 全'+Q.length+'問';document.getElementById('bar').style.width=Math.min(100,st.attempts/Q.length*100)+'%'}document.getElementById('next').onclick=function(){st.idx++;save();render()};document.getElementById('shuffle').onclick=function(){st.mode='all';st.order=mix(Q.map(function(_,i){return i}));st.idx=0;save();render()};document.getElementById('wrongOnly').onclick=function(){var w=Object.keys(st.hist).filter(function(k){return st.hist[k].wrong>0});if(!w.length){alert('まだ誤答履歴がありません。');return}st.mode='wrong';st.idx=0;save();render()};document.getElementById('reset').onclick=function(){if(confirm('学習履歴をすべて削除しますか？')){localStorage.removeItem(key);location.reload()}};if('serviceWorker'in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}render();</script></body></html>
