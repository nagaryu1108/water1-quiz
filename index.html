var BUILD='v7-20260904';var RAW=window.QBANK||[];var auditErrors=[];function auditBank(bank){var ids={},ok=[];bank.forEach(function(x){var er=[];if(!x||!x.id)er.push('IDなし');if(ids[x.id])er.push('ID重複');ids[x.id]=1;if(!Array.isArray(x.o)||x.o.length!==5)er.push('選択肢が5個でない');if(!Array.isArray(x.e)||x.e.length!==5)er.push('解説が5個でない');if(!Number.isInteger(x.a)||x.a<0||x.a>4)er.push('正答番号不正');if(Array.isArray(x.o)&&new Set(x.o).size!==x.o.length)er.push('選択肢重複');if(Array.isArray(x.e)&&new Set(x.e).size!==x.e.length)er.push('個別解説の重複');if(Array.isArray(x.e)&&x.e.length===5&&x.e.every(function(v){return v===x.e[0]}))er.push('全肢同一解説');if(x.v&&x.v.kind==='multiLine'&&(!Array.isArray(x.v.series)||x.v.series.length<2))er.push('複数曲線データ不正');if(x.av&&x.v)er.push('問題用図と解説補助図の重複指定');if(er.length)auditErrors.push((x&&x.id?x.id:'?')+': '+er.join(' / '));else ok.push(x)});return ok}var Q=auditBank(RAW);
var KEY='water1_bank_v3';var S={hist:{},mode:'coverage',current:null,total:0,correct:0,currentAnswered:false,currentSel:null};function load(){try{var z=JSON.parse(localStorage.getItem(KEY));if(z)S=Object.assign(S,z)}catch(e){}}function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}function sh(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}function subjects(){var a=[];Q.forEach(function(x){if(a.indexOf(x.s)<0)a.push(x.s)});return a}function covered(id){return S.hist[id]&&S.hist[id].attempts>0}function coverageCount(){return Q.filter(function(x){return covered(x.id)}).length}function chooseCoverage(){var ss=sh(subjects().slice()),best=null,bestCount=999;ss.forEach(function(s){var pool=Q.filter(function(x){return x.s===s&&!covered(x.id)});if(pool.length){var c=Q.filter(function(x){return x.s===s&&covered(x.id)}).length;if(c<bestCount){bestCount=c;best=pool[Math.floor(Math.random()*pool.length)]}}});return best?best.id:null}function weight(x){var h=S.hist[x.id];if(!h)return .4;return 1+((h.wrong||0)/Math.max(1,h.attempts||0))*5+(h.wrong||0)*1.2}function weightedPick(pool){if(!pool.length)return null;var sum=pool.reduce(function(a,x){return a+weight(x)},0),r=Math.random()*sum;for(var i=0;i<pool.length;i++){r-=weight(pool[i]);if(r<=0)return pool[i].id}return pool[pool.length-1].id}function chooseWeak(){var seen=Q.filter(function(x){return covered(x.id)}),wrong=seen.filter(function(x){return(S.hist[x.id].wrong||0)>0});return weightedPick(wrong.length?wrong:seen.length?seen:Q)}function chooseLatest(){var p=Q.filter(function(x){return x.d&&x.d.indexOf('最新')>=0});return weightedPick(p.length?p:Q)}function nextId(){if(S.mode==='latest')return chooseLatest();if(S.mode==='weak')return chooseWeak();var c=chooseCoverage();if(c)return c;S.mode='weak';return chooseWeak()}function getQ(id){return Q.find(function(x){return x.id===id})}
function chart(v,box){box.innerHTML='';box.style.display='none';if(!v)return;var title=v.title?'<div class="vtitle">'+v.title+'</div>':'',note=v.note?'<div class="vnote">'+v.note+'</div>':'';if(v.kind==='table'){var h=title+'<table><thead><tr>'+v.headers.map(function(x){return'<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+v.rows.map(function(r){return'<tr>'+r.map(function(x){return'<td>'+x+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>'+note;box.innerHTML=h;box.style.display='block';return}if(v.kind==='barH'){var W=620,row=38,L=150,R=55,T=20,H=T+row*v.labels.length+35,max=v.max||Math.max.apply(null,v.values),pw=W-L-R,s='<svg viewBox="0 0 '+W+' '+H+'">';v.values.forEach(function(val,i){var y=T+i*row,w=pw*val/max;s+='<text x="'+(L-8)+'" y="'+(y+18)+'" text-anchor="end" font-size="12">'+v.labels[i]+'</text><rect x="'+L+'" y="'+(y+5)+'" width="'+w+'" height="20" fill="#64748b" rx="3"/><text x="'+(L+w+6)+'" y="'+(y+20)+'" font-size="12" font-weight="700">'+val+(v.unit||'')+'</text>'});s+='</svg>';box.innerHTML=title+s+note;box.style.display='block';return}if(v.kind==='multiLine'){var W=620,H=350,L=60,R=30,T=28,B=58,xmin=Math.min.apply(null,v.x),xmax=Math.max.apply(null,v.x),all=[];v.series.forEach(function(z){all=all.concat(z.y)});var ymin=Math.min.apply(null,all),ymax=Math.max.apply(null,all),pw=W-L-R,ph=H-T-B;function sx(x){return L+(x-xmin)/(xmax-xmin||1)*pw}function sy(y){return T+(ymax-y)/(ymax-ymin||1)*ph}var dash=['','6 4','2 3'],s='<svg viewBox="0 0 '+W+' '+H+'"><line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'" stroke="#334155"/><line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" stroke="#334155"/>';v.series.forEach(function(z,j){var pts=v.x.map(function(x,i){return sx(x)+','+sy(z.y[i])}).join(' ');s+='<polyline points="'+pts+'" fill="none" stroke="#334155" stroke-width="'+(3-j*.5)+'" stroke-dasharray="'+dash[j%dash.length]+'"/><text x="'+(W-R-5)+'" y="'+(sy(z.y[z.y.length-1])-6)+'" text-anchor="end" font-size="13" font-weight="800">'+z.label+'</text>'});s+='<text x="'+(L+pw/2)+'" y="'+(H-14)+'" text-anchor="middle" font-size="12">'+v.xLabel+'</text><text x="18" y="'+(T+ph/2)+'" transform="rotate(-90 18 '+(T+ph/2)+')" text-anchor="middle" font-size="12">'+v.yLabel+'</text></svg>';box.innerHTML=title+s+note;box.style.display='block';return}if(v.kind==='bar'||v.kind==='line'){box.innerHTML=title+'<div class="vnote">既存グラフ形式</div>'+note;box.style.display='block';renderLegacy(v,box,title,note)}}function renderLegacy(v,box,title,note){if(v.kind==='bar'){var W=620,H=330,L=58,R=20,T=20,B=66,max=v.max||Math.max.apply(null,v.values),pw=W-L-R,ph=H-T-B,bw=pw/v.values.length*.55,gap=pw/v.values.length,s='<svg viewBox="0 0 '+W+' '+H+'">';v.values.forEach(function(val,i){var x=L+gap*i+(gap-bw)/2,y=T+ph-(val/max)*ph,h=ph-(y-T);s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" fill="#64748b"/><text x="'+(x+bw/2)+'" y="'+(y-6)+'" text-anchor="middle" font-size="12">'+val+'</text><text x="'+(x+bw/2)+'" y="'+(H-B+22)+'" text-anchor="middle" font-size="11">'+v.labels[i]+'</text>'});s+='</svg>';box.innerHTML=title+s+note;box.style.display='block'}else if(v.kind==='line'){var W=620,H=340,L=64,R=22,T=20,B=62,xmin=Math.min.apply(null,v.x),xmax=Math.max.apply(null,v.x),ymin=Math.min.apply(null,v.y),ymax=Math.max.apply(null,v.y),pw=W-L-R,ph=H-T-B;function sx(x){return L+(x-xmin)/(xmax-xmin||1)*pw}function sy(y){return T+(ymax-y)/(ymax-ymin||1)*ph}var pts=v.x.map(function(x,i){return sx(x)+','+sy(v.y[i])}).join(' '),s='<svg viewBox="0 0 '+W+' '+H+'"><line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'" stroke="#334155"/><line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" stroke="#334155"/><polyline points="'+pts+'" fill="none" stroke="#334155" stroke-width="3"/>';v.x.forEach(function(x,i){s+='<circle cx="'+sx(x)+'" cy="'+sy(v.y[i])+'" r="4" fill="#fff" stroke="#334155"/>'});s+='</svg>';box.innerHTML=title+s+note;box.style.display='block'}}
function enrich(x){var h='';if(x.rxn&&x.rxn.length)h+='<div class="learn"><b>反応式・反応の流れ</b><br>'+x.rxn.join('<br>')+'</div>';if(x.terms&&x.terms.length)h+='<div class="learn"><b>用語ミニ解説</b><br>'+x.terms.map(function(t){return'<b>'+t.name+'</b>：'+t.desc}).join('<br><br>')+'</div>';return h}function render(){var w=document.getElementById('warn');w.innerHTML=auditErrors.length?'<div class="warn"><b>問題バンク検査で除外：</b><br>'+auditErrors.join('<br>')+'</div>':'';if(!Q.length)return; if(!S.current||!getQ(S.current)){S.current=nextId();S.currentAnswered=false;S.currentSel=null;save()}var x=getQ(S.current);document.getElementById('meta').innerHTML=x.s+' ｜ '+x.t+' <span class="badge">'+x.d+'</span> ｜ ID '+x.id;document.getElementById('q').textContent=x.q;chart(x.v,document.getElementById('visual'));var av=document.getElementById('afterVisual');av.innerHTML='';av.style.display='none';var box=document.getElementById('choices');box.innerHTML='';x.o.forEach(function(v,k){var b=document.createElement('button');b.className='ch';b.textContent=(k+1)+'. '+v;b.onclick=function(){pick(x,k)};box.appendChild(b);var d=document.createElement('div');d.className='ex';d.id='e'+k;d.textContent=x.e[k];box.appendChild(d)});document.getElementById('res').style.display='none';document.getElementById('next').style.display='none';document.getElementById('openall').style.display='none';if(S.currentAnswered&&S.currentSel!==null)showAnswered(x,S.currentSel);upd()}function showAnswered(x,k){var ok=k===x.a,bs=document.querySelectorAll('.ch');bs[x.a].classList.add('good');bs[x.a].innerHTML+=' <span class="ok">✓ 正解</span>';if(!ok){bs[k].classList.add('bad');bs[k].innerHTML+=' <span class="ng">✕ あなたの回答</span>'}var r=document.getElementById('res');r.style.display='block';r.innerHTML='<span class="'+(ok?'ok':'ng')+'">'+(ok?'✓ 正解':'✕ 不正解')+'</span><br>正答：'+(x.a+1)+'<br><br><b>この問題の核心</b><br>'+x.p+enrich(x)+'<div class="source"><b>出題根拠・参照：</b>'+x.src+'</div><br><b>全5肢を学習</b><br>各選択肢をタップすると、その直下に個別解説を表示します。';if(x.av&&!x.v)chart(x.av,document.getElementById('afterVisual'));document.getElementById('openall').style.display='block';document.getElementById('next').style.display='block'}function pick(x,k){if(S.currentAnswered){var d=document.getElementById('e'+k);d.style.display=d.style.display==='block'?'none':'block';return}var ok=k===x.a,h=S.hist[x.id]||{attempts:0,correct:0,wrong:0};h.attempts++;if(ok)h.correct++;else h.wrong++;h.lastSel=k;S.hist[x.id]=h;S.total++;if(ok)S.correct++;S.currentAnswered=true;S.currentSel=k;save();showAnswered(x,k);upd()}function upd(){var cov=coverageCount(),pct=Q.length?Math.round(cov/Q.length*100):0,rate=S.total?Math.round(S.correct/S.total*100):0;document.getElementById('stats').textContent='解答 '+S.total+'回　正解 '+S.correct+'回　正答率 '+rate+'%　｜ 網羅 '+cov+'/'+Q.length+'問';document.getElementById('bar').style.width=pct+'%';document.getElementById('dash').textContent=subjects().map(function(s){var a=Q.filter(function(x){return x.s===s});return s+' '+a.filter(function(x){return covered(x.id)}).length+'/'+a.length}).join(' ｜ ');document.getElementById('audit').textContent='自動構造監査：'+Q.length+'/'+RAW.length+'問 合格'+(auditErrors.length?'（'+auditErrors.length+'問除外）':'');['coverage','weak','latest'].forEach(function(id){document.getElementById(id).className=S.mode===id?'on':''})}document.getElementById('next').onclick=function(){S.current=nextId();S.currentAnswered=false;S.currentSel=null;save();render()};document.getElementById('openall').onclick=function(){for(var i=0;i<5;i++)document.getElementById('e'+i).style.display='block'};['coverage','weak','latest'].forEach(function(id){document.getElementById(id).onclick=function(){S.mode=id;S.current=nextId();S.currentAnswered=false;S.currentSel=null;save();render()}});load();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=70').then(function(r){r.update().catch(function(){})}).catch(function(){});render();
</script></body></html>
