<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d4ed8"><link rel="manifest" href="./manifest.webmanifest"><title>水質第1種 本試験型演習</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.w{max-width:760px;margin:auto;padding:14px}.h{background:#173f78;color:white;padding:18px;border-radius:16px}.h h1{font-size:20px;margin:0 0 8px}.small{font-size:12px;opacity:.9}.card{background:white;margin-top:12px;padding:18px;border-radius:16px;box-shadow:0 2px 12px #0001}.meta{font-size:13px;font-weight:700;color:#1d4ed8}.q{font-size:17px;font-weight:700;line-height:1.75;margin:13px 0;white-space:pre-wrap}.ch{width:100%;text-align:left;background:white;border:2px solid #d9e2ef;border-radius:13px;padding:13px;margin:6px 0;font-size:15px;line-height:1.6;color:#172033}.ch.good{border-color:#16a34a;background:#ecfdf3}.ch.bad{border-color:#dc2626;background:#fff1f2}.ex{display:none;margin:-3px 5px 10px;padding:12px 13px;border-left:4px solid #64748b;background:#f8fafc;font-size:14px;line-height:1.75;white-space:pre-wrap}.res{display:none;margin-top:14px;padding:14px;border-radius:12px;background:#eef2f7;line-height:1.7}.next{display:none;width:100%;border:0;border-radius:12px;background:#1d4ed8;color:white;padding:14px;margin-top:12px;font-size:16px;font-weight:800}.ok{color:#15803d;font-weight:800}.ng{color:#b91c1c;font-weight:800}.bar{height:7px;background:#dbe3ee;border-radius:8px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:#60a5fa}.notice{font-size:12px;color:#64748b;margin-top:12px;line-height:1.6}</style></head><body><main class="w"><header class="h"><h1>公害防止管理者 水質第1種｜本試験型</h1><div id="stats" class="small"></div><div class="bar"><i id="bar"></i></div></header><section class="card"><div id="meta" class="meta"></div><div id="q" class="q"></div><div id="choices"></div><div id="res" class="res"></div><button id="next" class="next">次の問題へ</button><div class="notice">回答直後に自動保存。回答後は5つすべての選択肢をタップでき、その選択肢の直下に「どこが正しい／誤りか・修正文・関連知識」を表示します。現在は問題数より品質を優先した改訂版です。</div></section></main><script>var Q=[
{s:'公害総論',t:'水質汚濁防止法',d:'本試験標準',q:'水質汚濁防止法に関する記述として、誤っているものはどれか。',o:['排水基準は、特定事業場から公共用水域に排出される排出水について適用される。','都道府県は、国の一律排水基準では水質汚濁防止が十分でないと認められる区域について、条例でより厳しい排水基準を定めることができる。','排水基準に違反した排出水を排出した場合、改善命令が出された後に再度違反したときに限って罰則の対象となる。','特定施設を設置する工場又は事業場は、特定事業場に該当する。','濃度規制だけでは環境基準の確保が困難な指定水域では、汚濁負荷量に着目した総量規制が行われる。'],a:2,p:'排水基準違反には、改善命令を経なければ処罰できないという一般則はない。いわゆる直罰規定との区別がポイント。',e:['【正しい】排水基準は「排出水」に対する規制基準である。環境基準が公共用水域そのものについての行政上の目標であるのに対し、排水基準は事業場から出る水を規制する。\n【比較】環境基準＝環境側の目標、排水基準＝排出側の規制。','【正しい】これは上乗せ排水基準の考え方である。国の一律基準より厳しい値を条例で設定する。\n【ひっかけ】「国の規制対象外の施設や項目まで条例で規制する」は横出し規制であり、上乗せとは異なる。','【誤り】「改善命令後の再違反に限る」が誤り。排水基準違反については、違反行為自体が罰則対象となり得る直罰の仕組みがある。\n【修正】「排水基準違反は、改善命令を経なくても罰則の対象となり得る。」\n【試験】改善命令と直罰の順序関係を入れ替える肢に注意。','【正しい】特定施設を設置する工場・事業場が特定事業場。\n【区別】特定施設＝設備・施設そのもの、特定事業場＝それを設置する工場又は事業場。','【正しい】総量規制は濃度だけでなく「濃度×排水量」に対応する汚濁負荷量を管理する発想。閉鎖性水域では希釈して濃度だけ下げても総負荷が減らないため重要。']},
{s:'公害総論',t:'環境基準・排水基準',d:'本試験標準',q:'環境基準と排水規制に関する記述として、最も適当なものはどれか。',o:['環境基準は、個々の工場又は事業場が遵守すべき排出水の許容限度を直接定めたものである。','一律排水基準より厳しい基準を都道府県条例で定めることを横出し規制という。','生活環境項目の排水基準は、すべての事業場に排水量にかかわらず同一に適用される。','環境基準は人の健康の保護及び生活環境の保全上維持されることが望ましい基準であり、排水基準とは法的性格・対象が異なる。','総量規制では排出水中の濃度だけを規制し、排水量は考慮しない。'],a:3,p:'環境基準と排水基準を「対象」と「役割」で区別する。',e:['【誤り】これは排水基準の説明に近い。環境基準は公共用水域等の環境について維持されることが望ましい目標。\n【修正】「排水基準は、特定事業場からの排出水について許容限度を定める規制基準である。」','【誤り】一律基準をより厳しくするのは「上乗せ」。横出しは国の規制対象外の施設・項目等へ規制対象を広げる考え方。\n【修正】「一律排水基準より厳しい基準を条例で定めることを上乗せという。」','【誤り】生活環境項目には適用に排水量等の条件が関係する。健康項目との適用の違いも頻出。\n【学習】「有害物質（健康項目）」と「生活環境項目」を同じ適用条件だと思わないこと。','【正しい】環境基準は環境側の目標、排水基準は排出側の規制。名称が似ていても対象と法的役割が異なる。','【誤り】総量規制はまさに排水量を含む汚濁負荷量を問題にする。\n【修正】「総量規制では濃度と排水量を基礎として汚濁負荷量を規制する。」']},
{s:'水質概論',t:'溶存酸素・湖沼',d:'本試験標準',q:'水中の溶存酸素（DO）に関する記述として、誤っているものはどれか。',o:['水温が低いほど、一般に酸素の飽和溶解度は大きくなる。','大気からの再曝気は、水中への酸素供給経路の一つである。','植物プランクトンの光合成は、日中の表層水のDOを上昇させることがある。','強い水温成層が形成されると、表層から底層への酸素供給が促進される。','底層が貧酸素化すると、還元的条件が発達し、底泥から一部の物質が溶出しやすくなることがある。'],a:3,p:'成層は鉛直混合を抑えるため、底層への酸素供給を妨げる方向に働く。',e:['【正しい】気体の溶解度は一般に低温ほど大きく、DO飽和濃度も水温低下で高くなる。\n【試験】「水温上昇→飽和DO上昇」と逆転させる肢に注意。','【正しい】水面を介した大気とのガス交換（再曝気）は主要な酸素供給過程。河川では流れ・乱れが強いほど再曝気が大きくなりやすい。','【正しい】光合成は酸素を生成するため、日中に表層DOが上昇し、場合によっては過飽和となる。夜間は呼吸のみとなりDOが低下し得る。','【誤り】「促進」が逆。水温成層による密度差は鉛直混合を抑制し、表層から底層への酸素輸送を小さくする。\n【修正】「強い水温成層が形成されると、表層から底層への酸素供給は抑制される。」\n【連鎖】成層→酸素供給低下→底層DO低下→還元化、という流れを覚える。','【正しい】貧酸素・無酸素化で底泥表面が還元的になると、鉄・マンガンや栄養塩などの挙動が変化し、溶出が促進される場合がある。']},
{s:'水質概論',t:'富栄養化',d:'本試験標準',q:'湖沼・閉鎖性水域の富栄養化に関する記述として、最も適当なものはどれか。',o:['富栄養化が進行すると、植物プランクトンの増殖により常に水域全層のDOが増加する。','底泥からのりんの溶出は外部負荷に分類される。','植物プランクトンの大量増殖後、その死骸の分解は底層の酸素消費を増加させる要因となる。','水温成層が発達すると上下層の混合が強まり、底層の貧酸素化は生じにくくなる。','滞留時間が長い水域ほど栄養塩が必ず低濃度となる。'],a:2,p:'一次生産の増大と、その後の有機物沈降・分解による酸素消費まで一連で理解する。',e:['【誤り】表層では光合成でDOが増えることがあるが、沈降有機物の分解により底層では酸素消費が増える。全層で常に増加するわけではない。','【誤り】底泥からの再溶出は水域内部に蓄積された物質の再供給なので「内部負荷」。河川流入・排水など水域外からの供給が外部負荷。','【正しい】藻類増殖→死滅・沈降→微生物分解→酸素消費という経路が底層貧酸素化に結び付く。富栄養化問題の中心的因果関係。','【誤り】成層は密度差により鉛直混合を弱める。\n【修正】「水温成層が発達すると上下層の混合が抑制され、底層への酸素供給が低下しやすい。」','【誤り】滞留時間が長いと物質が蓄積しやすくなる場合があり、必ず低濃度になるわけではない。「必ず」という断定にも注意。']},
{s:'汚水処理特論',t:'活性汚泥・SRT',d:'本試験標準',q:'活性汚泥法の運転管理に関する記述として、誤っているものはどれか。',o:['SRTは、処理系内に存在する汚泥量と系外へ排出される汚泥量との関係から評価される。','硝化菌は一般に増殖速度が遅いため、硝化を安定して進めるには十分なSRTの確保が重要である。','余剰汚泥の引抜量を増加させると、他の条件が同じならSRTは長くなる。','F/M比は、微生物量に対する流入有機物負荷の大きさを表す運転指標である。','最終沈殿池で沈降した汚泥の一部を返送するのは、曝気槽内の必要な微生物濃度を維持するためである。'],a:2,p:'余剰汚泥引抜きとSRTの方向関係は頻出。引抜きを増やすほど系内汚泥の平均滞留時間は短くなる。',e:['【正しい】SRT（汚泥滞留時間）は系内汚泥量を、単位時間当たり系外へ失われる汚泥量で割る考え方が基本。処理水SSによる流出も厳密には考慮する。','【正しい】硝化菌は従属栄養細菌より増殖が遅いため、短すぎるSRTでは系外へ流出し硝化が維持できない。低水温ではさらに注意が必要。','【誤り】方向が逆。余剰汚泥の引抜量を増やすと系外へ失われる汚泥量が増え、SRTは短くなる。\n【修正】「余剰汚泥の引抜量を増加させると、他条件一定ならSRTは短くなる。」\n【試験】SRTとHRTを混同しない。SRTは微生物・固形物、HRTは水の滞留時間。','【正しい】F/M比＝Food/Microorganism。一般には有機物負荷を曝気槽内微生物量で除して考える。運転状態・汚泥性状と関連する。','【正しい】返送汚泥は最終沈殿池で分離した活性汚泥を曝気槽へ戻す操作。余剰分は系外へ引き抜く。この「返送」と「余剰引抜き」の役割を区別する。']},
{s:'汚水処理特論',t:'沈殿分離',d:'本試験標準・計算',q:'理想的な横流式沈殿池で、表面積を変えずに流入水量を2倍にした。他の条件および粒子の沈降速度分布が同じであるとき、沈降速度一定の独立粒子の除去について最も適当なものはどれか。',o:['表面負荷は1/2となり、除去可能な限界沈降速度も1/2となる。','表面負荷は2倍となり、除去可能な限界沈降速度も2倍となる。','滞留時間だけで除去率が決まるため、表面積が同じなら除去特性は変化しない。','沈殿池の深さを2倍にしなければ表面負荷を元に戻せない。','表面負荷は水量に依存せず、池の深さだけで決まる。'],a:1,p:'理想沈殿池の基本は表面負荷 Q/A。水量増加は表面負荷を増やし、除去できる粒子の条件を厳しくする。',e:['【誤り】Qが2倍、A一定なのでQ/Aは2倍であり1/2ではない。','【正しい】表面負荷＝Q/A。理想沈殿では限界沈降速度と表面負荷を比較して分離可能性を考える。Qが2倍なら表面負荷も2倍。','【誤り】理想的な独立粒子沈殿では表面積（表面負荷）が重要。滞留時間だけで決まるという説明は不適切。\n【試験】「深さ」や「滞留時間」を主因に見せるひっかけが出やすい。','【誤り】表面負荷Q/Aには池深さは直接入らない。元の表面負荷に戻すなら、Qが2倍の場合は表面積Aを2倍にするのが基本。','【誤り】表面負荷はQ/Aであり流量と表面積から決まる。深さは式に直接含まれない。']},
{s:'水質有害物質特論',t:'分析精度管理',d:'本試験標準',q:'水質分析における精度管理に関する記述として、誤っているものはどれか。',o:['操作ブランクは、試薬や器具、前処理操作などに由来する汚染の把握に利用できる。','添加回収試験は、実試料のマトリックス中で前処理や測定による損失・妨害の程度を評価するのに有用である。','内部標準法では、試料と標準液に一定量の内部標準物質を加え、目的成分との信号比を利用することがある。','検出下限と定量下限は同義であり、通常は同じ濃度を示す。','検量線の範囲を大きく外れる試料は、適切な希釈等を行って測定範囲内に入れることが必要な場合がある。'],a:3,p:'検出できることと、十分な精度で定量できることは別。一般に定量下限は検出下限より高い。',e:['【正しい】ブランクから対象成分が検出されれば、試薬・器具・操作環境などからの汚染を疑う。低濃度分析ほど重要。','【正しい】既知量を実試料へ添加し、前処理を含めてどれだけ回収できたかを見る。標準液だけでは分からないマトリックス影響の評価に役立つ。','【正しい】信号の絶対値ではなく目的成分/内部標準の比を使い、注入量や装置感度の変動などを補正する。内部標準物質の選択も重要。','【誤り】同義ではない。検出下限は存在を検出できる最低レベル、定量下限は一定の精度・正確さで数値として定量できる最低レベルという考え方で、一般に定量下限の方が高い。\n【修正】「検出下限と定量下限は異なる概念である。」','【正しい】検量線範囲外の外挿は信頼性が低い。高濃度試料なら希釈し、希釈倍率を考慮して濃度を算出する。']},
{s:'水質有害物質特論',t:'ICP-MS・干渉',d:'本試験標準',q:'ICP-MSによる元素分析に関する記述として、最も適当なものはどれか。',o:['ICP-MSでは元素固有の発光強度のみを測定するため、質量数による分離は行わない。','共存成分から生成する多原子イオンが目的元素と同じ質量電荷比に現れ、スペクトル干渉となることがある。','マトリックス成分はイオン化や導入効率に影響しないため、内部標準は使用できない。','ICP-MSは一般に原子吸光法より低感度であり、微量元素分析には適さない。','試料中の溶解塩濃度が高いほど、常に目的元素の信号強度は比例して増加する。'],a:1,p:'ICP-MSはm/zでイオンを測る。多原子イオン・同重体などのスペクトル干渉とマトリックス効果を区別する。',e:['【誤り】これはICP発光分析（ICP-OES）的な説明との混同。ICP-MSはプラズマで生成したイオンを質量分析部で質量電荷比m/zにより分離・検出する。','【正しい】例としてプラズマガスや試料成分由来の多原子イオンが分析対象と同じm/zに重なると正の誤差を生じ得る。衝突・反応セル等による低減策が用いられる。','【誤り】高濃度マトリックスはイオン化・輸送・空間電荷効果などを通じて信号へ影響し得る。内部標準法はその補正に利用される。','【誤り】ICP-MSは多元素を高感度に測定でき、微量・超微量元素分析に広く用いられる。分析対象・干渉・装置条件によって適否は変わる。','【誤り】高塩濃度は信号抑制、堆積、導入系への負荷などの原因になり得る。「常に比例して増加」は誤り。希釈やマトリックス対策が必要になる場合がある。']},
{s:'大規模水質特論',t:'成層・内部負荷',d:'本試験標準',q:'夏季に水温成層が発達する富栄養湖の水質変化に関する記述として、誤っているものはどれか。',o:['水温躍層が発達すると、表層と深層の鉛直混合は抑制される。','深水層では、有機物分解による酸素消費が酸素供給を上回ると貧酸素化が進む。','底泥表面が還元的になると、底泥からのりん供給が増加する場合がある。','秋季に成層が崩壊して全層循環が起こると、深層に蓄積していた物質が表層側へ輸送されることがある。','成層が強いほど表層から深層への酸素輸送が増加するため、底層貧酸素化は抑制される。'],a:4,p:'成層の効果は「鉛直混合を抑える」。これを起点にDO・底泥・栄養塩の連鎖を判断する。',e:['【正しい】水温差→密度差→鉛直混合抑制。躍層は上下層間の物質輸送を妨げる。','【正しい】深層では光合成による酸素供給が乏しく、沈降有機物の分解で酸素が消費される。表層からの補給も成層で弱まるため貧酸素化しやすい。','【正しい】還元状態では底泥中の鉄化合物等と結び付いていたりんの挙動が変わり、溶出が増える場合がある。これは内部負荷の重要機構。','【正しい】成層崩壊後の鉛直混合により、深層の栄養塩などが上層へ輸送されることがある。循環は酸素を深層へ運ぶ一方、深層物質を上へ運ぶ側面もある。','【誤り】方向が逆。強い成層ほど鉛直混合が抑制され、表層から深層への酸素供給は低下する。\n【修正】「成層が強いほど深層への酸素輸送が抑制され、底層貧酸素化を助長することがある。」']},
{s:'大規模水質特論',t:'閉鎖性海域',d:'本試験標準',q:'閉鎖性海域における水質汚濁に関する記述として、最も適当なものはどれか。',o:['外海との水交換が小さいほど、流入した汚濁物質は一般に速やかに系外へ排出される。','赤潮は底層の無酸素水が湧昇して海面が青白く見える現象をいう。','青潮は植物プランクトンが高密度に増殖して海水が赤褐色等に着色する現象をいう。','外部負荷を削減しても、底泥からの内部負荷が大きい場合には水質改善の応答が遅れることがある。','貧酸素水塊は、有機物分解による酸素消費が小さいほど発達しやすい。'],a:3,p:'閉鎖性水域では外部負荷だけでなく、過去に底泥へ蓄積した栄養塩等の内部負荷が水質回復を遅らせ得る。',e:['【誤り】水交換が小さいほど滞留しやすく、物質が蓄積しやすい方向に働く。\n【修正】「外海との水交換が小さいほど、流入物質が滞留しやすい。」','【誤り】これは青潮の説明。青潮は硫化物を含む貧酸素・無酸素水の湧昇などに関連する。','【誤り】これは赤潮の説明。赤潮＝植物プランクトン等の異常増殖による着色、青潮＝還元的な底層水の湧昇に伴う青白い呈色。対で問われやすい。','【正しい】外からの負荷を減らしても、底泥に蓄積したりん等が再溶出すれば内部から供給が続く。このため改善に時間を要することがある。','【誤り】有機物分解による酸素消費が大きいほど貧酸素化を促進する。成層による酸素供給不足との収支で考える。']}
];var K='water1_quality_v2',S={i:0,ord:[],hist:{},n:0,c:0};try{var x=JSON.parse(localStorage.getItem(K));if(x)S=x}catch(e){}function sh(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}if(!S.ord.length)S.ord=sh(Q.map(function(_,i){return i}));function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}function render(){var id=S.ord[S.i%S.ord.length],x=Q[id];document.getElementById('meta').textContent=x.s+' ｜ '+x.t+' ｜ '+x.d+' ｜ 問題 '+(S.i+1)+'/'+Q.length;document.getElementById('q').textContent=x.q;var box=document.getElementById('choices');box.innerHTML='';x.o.forEach(function(v,k){var b=document.createElement('button');b.className='ch';b.textContent=(k+1)+'. '+v;b.onclick=function(){pick(id,k)};box.appendChild(b);var d=document.createElement('div');d.className='ex';d.id='e'+k;d.textContent=x.e[k];box.appendChild(d)});document.getElementById('res').style.display='none';document.getElementById('next').style.display='none';upd()}function pick(id,k){var x=Q[id],h=S.hist[id];if(h){var d=document.getElementById('e'+k);d.style.display=d.style.display==='block'?'none':'block';return}var ok=k===x.a;S.hist[id]={sel:k,ok:ok};S.n++;if(ok)S.c++;save();var bs=document.querySelectorAll('.ch');bs[x.a].classList.add('good');bs[x.a].innerHTML+=' <span class="ok">✓ 正解</span>';if(!ok){bs[k].classList.add('bad');bs[k].innerHTML+=' <span class="ng">✕ あなたの回答</span>'}var r=document.getElementById('res');r.style.display='block';r.innerHTML='<span class="'+(ok?'ok':'ng')+'">'+(ok?'✓ 正解':'✕ 不正解')+'</span><br>正答：'+(x.a+1)+'<br><br><b>この問題の核心</b><br>'+x.p+'<br><br><b>全選択肢を学習できます</b><br>上の各選択肢をタップすると、その直下に個別解説が開きます。';document.getElementById('next').style.display='block';upd()}function upd(){document.getElementById('stats').textContent='解答 '+S.n+'問　正解 '+S.c+'問　正答率 '+(S.n?Math.round(S.c/S.n*100):0)+'%';document.getElementById('bar').style.width=Math.min(100,S.n/Q.length*100)+'%'}document.getElementById('next').onclick=function(){S.i++;save();render()};if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){})}render();</script></body></html>
