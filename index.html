<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f78"><link rel="manifest" href="./manifest.webmanifest"><title>水質第1種 本試験型演習</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.w{max-width:780px;margin:auto;padding:14px}.h{background:#173f78;color:#fff;padding:18px;border-radius:16px}.h h1{font-size:20px;margin:0 0 8px}.small{font-size:12px;line-height:1.6;opacity:.95}.bar{height:7px;background:#dbe3ee;border-radius:8px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:#60a5fa;width:0}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.tools button{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:9px 5px;font-size:12px;color:#172033}.tools button.on{background:#dbeafe;border-color:#2563eb;font-weight:800}.card{background:#fff;padding:18px;border-radius:16px;box-shadow:0 2px 12px #0001}.meta{font-size:13px;font-weight:800;color:#1d4ed8;line-height:1.6}.q{font-size:17px;font-weight:700;line-height:1.78;margin:13px 0;white-space:pre-wrap}.ch{width:100%;text-align:left;background:#fff;border:2px solid #d9e2ef;border-radius:13px;padding:13px;margin:6px 0;font-size:15px;line-height:1.62;color:#172033}.ch.good{border-color:#16a34a;background:#ecfdf3}.ch.bad{border-color:#dc2626;background:#fff1f2}.ex{display:none;margin:-3px 5px 10px;padding:12px 13px;border-left:4px solid #64748b;background:#f8fafc;font-size:14px;line-height:1.78;white-space:pre-wrap}.res{display:none;margin-top:14px;padding:14px;border-radius:12px;background:#eef2f7;line-height:1.72}.next,.openall{display:none;width:100%;border:0;border-radius:12px;padding:14px;margin-top:10px;font-size:15px;font-weight:800}.next{background:#1d4ed8;color:#fff}.openall{background:#e2e8f0;color:#172033}.ok{color:#15803d;font-weight:800}.ng{color:#b91c1c;font-weight:800}.notice{font-size:12px;color:#64748b;margin-top:12px;line-height:1.65}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#e0e7ff;color:#3730a3;font-size:11px;margin-left:5px}.source{margin-top:8px;font-size:12px;color:#475569}.dash{margin-top:8px;font-size:11px;line-height:1.55;color:#dbeafe}</style></head><body><main class="w"><header class="h"><h1>公害防止管理者 水質第1種｜本試験型</h1><div id="stats" class="small">読み込み中…</div><div id="dash" class="dash"></div><div class="bar"><i id="bar"></i></div></header><div class="tools"><button id="coverage" class="on">5科目網羅</button><button id="weak">苦手優先</button><button id="latest">最新動向</button></div><section class="card"><div id="meta" class="meta"></div><div id="q" class="q"></div><div id="choices"></div><div id="res" class="res"></div><button id="openall" class="openall">全5肢の解説を開く</button><button id="next" class="next">次の問題へ</button><div class="notice">回答した瞬間に端末内へ自動保存します。一定時間ごとの保存はしていません。網羅モードでは未回答論点を5科目均等に優先し、一巡後は誤答率の高い問題・論点を自動的に多めに再出題します。法令・JISは原則として2026年4月1日施行状況を基準にし、環境省の直近公表資料を使う問題は「最新動向・予想」と明示します。</div></section></main><script src="./qbank_v3.js"></script><script>var Q=window.QBANK||[];var KEY='water1_bank_v3';var S={hist:{},mode:'coverage',current:null,total:0,correct:0,legacyN:0,legacyC:0};function load(){try{var z=JSON.parse(localStorage.getItem(KEY));if(z)S=z;else{var old=JSON.parse(localStorage.getItem('water1_quality_v2')||'null');if(old){S.legacyN=old.n||0;S.legacyC=old.c||0}}}catch(e){}}function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}function sh(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}function subjects(){var a=[];Q.forEach(function(x){if(a.indexOf(x.s)<0)a.push(x.s)});return a}function covered(id){return S.hist[id]&&S.hist[id].attempts>0}function coverageCount(){var n=0;Q.forEach(function(x){if(covered(x.id))n++});return n}function chooseCoverage(){var ss=subjects(),best=null,bestCount=999;sh(ss);ss.forEach(function(s){var pool=Q.filter(function(x){return x.s===s&&!covered(x.id)});if(pool.length){var c=Q.filter(function(x){return x.s===s&&covered(x.id)}).length;if(c<bestCount){bestCount=c;best=pool[Math.floor(Math.random()*pool.length)]}}});return best?best.id:null}function weight(x){var h=S.hist[x.id];if(!h)return .4;var rate=h.wrong/Math.max(1,h.attempts);return 1+rate*5+h.wrong*1.2}function weightedPick(pool){if(!pool.length)return null;var sum=0,i;for(i=0;i<pool.length;i++)sum+=weight(pool[i]);var r=Math.random()*sum;for(i=0;i<pool.length;i++){r-=weight(pool[i]);if(r<=0)return pool[i].id}return pool[pool.length-1].id}function chooseWeak(){var seen=Q.filter(function(x){return covered(x.id)});var wrong=seen.filter(function(x){return S.hist[x.id].wrong>0});return weightedPick(wrong.length?wrong:seen.length?seen:Q)}function chooseLatest(){var p=Q.filter(function(x){return x.d.indexOf('最新')>=0});return weightedPick(p.length?p:Q)}function nextId(){if(S.mode==='latest')return chooseLatest();if(S.mode==='weak')return chooseWeak();var c=chooseCoverage();if(c)return c;S.mode='weak';return chooseWeak()}function getQ(id){for(var i=0;i<Q.length;i++)if(Q[i].id===id)return Q[i];return null}function render(){if(!Q.length){document.getElementById('q').textContent='問題バンクを読み込めませんでした。ページを再読み込みしてください。';return}if(!S.current||!getQ(S.current))S.current=nextId();var x=getQ(S.current);document.getElementById('meta').innerHTML=x.s+' ｜ '+x.t+' <span class="badge">'+x.d+'</span>';document.getElementById('q').textContent=x.q;var box=document.getElementById('choices');box.innerHTML='';var h=S.hist[x.id];x.o.forEach(function(v,k){var b=document.createElement('button');b.className='ch';b.textContent=(k+1)+'. '+v;b.onclick=function(){pick(x,k)};box.appendChild(b);var d=document.createElement('div');d.className='ex';d.id='e'+k;d.textContent=x.e[k];box.appendChild(d)});var r=document.getElementById('res');r.style.display='none';document.getElementById('next').style.display='none';document.getElementById('openall').style.display='none';if(h&&h.lastSel!==undefined)showAnswered(x,h.lastSel,false);upd()}function showAnswered(x,k,countNow){var ok=k===x.a,bs=document.querySelectorAll('.ch');bs[x.a].classList.add('good');bs[x.a].innerHTML+=' <span class="ok">✓ 正解</span>';if(!ok){bs[k].classList.add('bad');bs[k].innerHTML+=' <span class="ng">✕ あなたの回答</span>'}var r=document.getElementById('res');r.style.display='block';r.innerHTML='<span class="'+(ok?'ok':'ng')+'">'+(ok?'✓ 正解':'✕ 不正解')+'</span><br>正答：'+(x.a+1)+'<br><br><b>この問題の核心</b><br>'+x.p+'<div class="source"><b>出題根拠・参照：</b>'+x.src+'</div><br><b>全5肢を学習</b><br>各選択肢をタップすると、その直下に「誤り箇所・理由・修正・関連知識・ひっかけ」を表示します。';document.getElementById('openall').style.display='block';document.getElementById('next').style.display='block';if(countNow)upd()}function pick(x,k){var h=S.hist[x.id];if(h&&h.attempts>0){var d=document.getElementById('e'+k);d.style.display=d.style.display==='block'?'none':'block';save();return}var ok=k===x.a;S.hist[x.id]={attempts:1,correct:ok?1:0,wrong:ok?0:1,lastSel:k};S.total++;if(ok)S.correct++;save();showAnswered(x,k,true)}function upd(){var cov=coverageCount(),pct=Q.length?Math.round(cov/Q.length*100):0,rate=S.total?Math.round(S.correct/S.total*100):0;document.getElementById('stats').textContent='新版 解答 '+S.total+'問　正解 '+S.correct+'問　正答率 '+rate+'%　｜ 網羅 '+cov+'/'+Q.length+'問'+(S.legacyN?'　｜ 旧10問版実績 '+S.legacyN+'問':'' );document.getElementById('bar').style.width=pct+'%';var ss=subjects(),parts=[];ss.forEach(function(s){var all=Q.filter(function(x){return x.s===s}).length,c=Q.filter(function(x){return x.s===s&&covered(x.id)}).length;parts.push(s+' '+c+'/'+all)});document.getElementById('dash').textContent=parts.join(' ｜ ');['coverage','weak','latest'].forEach(function(id){document.getElementById(id).className=S.mode===id?'on':''})}document.getElementById('next').onclick=function(){S.current=nextId();save();render()};document.getElementById('openall').onclick=function(){for(var i=0;i<5;i++)document.getElementById('e'+i).style.display='block';save()};document.getElementById('coverage').onclick=function(){S.mode='coverage';S.current=nextId();save();render()};document.getElementById('weak').onclick=function(){S.mode='weak';S.current=nextId();save();render()};document.getElementById('latest').onclick=function(){S.mode='latest';S.current=nextId();save();render()};load();if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){})}render();</script></body></html>
