<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>環境基準・排水基準 3択穴埋め演習</title>
<style>
:root{--ink:#20252b;--muted:#66717c;--line:#aeb6bd;--head:#e9edf0;--sub:#f6f7f8;--accent:#184f7a;--good:#16833b;--bad:#c92f2f;--focus:#fff4be;--bg:#f5f6f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.55}a{color:var(--accent)}button,select{font:inherit}.wrap{max-width:980px;margin:auto;padding:14px 12px 110px}.top{background:#fff;border-bottom:4px solid #4f5962;padding:18px 16px;margin:-14px -12px 14px}.eyebrow{font-size:12px;color:var(--muted);font-weight:700}.top h1{font-size:22px;line-height:1.3;margin:5px 0 8px}.top p{margin:0;color:#4f5962;font-size:14px}.notice{margin:12px 0;padding:10px 12px;background:#eef4f7;border-left:4px solid var(--accent);font-size:13px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin:14px 0}.label{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}.select{width:100%;min-height:44px;border:1px solid #9ea7af;border-radius:4px;background:#fff;padding:8px 10px}.mode{display:flex;gap:6px}.mode button,.smallbtn{min-height:44px;border:1px solid #8e979f;border-radius:4px;background:#fff;padding:8px 11px;font-weight:700}.mode button.active{background:#39444e;color:#fff;border-color:#39444e}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 14px}.stat{background:#fff;border:1px solid #c7cdd2;padding:9px 8px;text-align:center}.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:var(--muted)}.sheet{background:#fff;border:1px solid #b7bec4;padding:14px 10px 16px}.sheet-head{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;margin:0 2px 10px}.sheet h2{font-size:18px;margin:0}.subtext{font-size:12px;color:var(--muted);margin-top:3px}.source{white-space:nowrap;font-size:12px}.table-scroll{overflow:auto;-webkit-overflow-scrolling:touch;border-top:2px solid #565f67;border-bottom:1px solid #8e979f}.std{width:100%;border-collapse:collapse;background:#fff;font-size:13px;min-width:560px}.std th,.std td{border:1px solid var(--line);padding:8px 9px;vertical-align:middle}.std thead th{background:var(--head);font-weight:700;text-align:center}.std tbody th{background:var(--sub);font-weight:700;text-align:left;min-width:120px;position:sticky;left:0;z-index:1}.std td{text-align:center}.std .target-row th,.std .target-row td{background:#fffaf0}.std .target-row th{background:#fff6d9}.blank{display:inline-flex;align-items:center;justify-content:center;min-width:88px;min-height:38px;padding:4px 10px;border:2px dashed #546a79;background:var(--focus);font-weight:800;color:#223a4a;border-radius:3px}.correct-cell{background:#e7f6eb!important;color:#0d6a2a;font-weight:800}.legend{font-size:12px;color:#5c6670;margin:9px 2px 0}.question{margin:13px 0 0;padding:12px;border:1px solid #c2c8cd;background:#fafbfb}.qline{font-weight:800;margin-bottom:8px}.options{display:grid;gap:8px}.opt{border:2px solid #8f9aa3;border-radius:6px;background:#fff;padding:12px 11px;text-align:left;font-weight:750;color:#20252b}.opt.good{border-color:var(--good);background:#e9f7ed;color:#0b6c2a}.opt.bad{border-color:var(--bad);background:#fdeaea;color:#9d2020}.result{display:none;margin-top:10px;padding:10px 11px;border-left:4px solid #8b949b;background:#fff}.result.show{display:block}.result.good{border-left-color:var(--good)}.result.bad{border-left-color:var(--bad)}.result b{font-size:17px}.next{display:none;width:100%;margin-top:11px;min-height:48px;border:0;border-radius:5px;background:#244d68;color:#fff;font-weight:800;font-size:16px}.next.show{display:block}.study-note{margin-top:12px;padding:10px 12px;background:#f7f8f9;border:1px solid #d1d5d9;font-size:12px}.foot-actions{display:flex;justify-content:space-between;gap:8px;margin-top:12px}.foot-actions button{border:1px solid #9ca5ad;background:#fff;border-radius:4px;padding:8px 10px;color:#39434b}.allmode .question{display:none}.allmode .std .target-row th,.allmode .std .target-row td{background:inherit}@media(max-width:620px){.wrap{padding-left:8px;padding-right:8px}.top{margin-left:-8px;margin-right:-8px}.toolbar{grid-template-columns:1fr}.mode{display:grid;grid-template-columns:1fr 1fr}.stats{gap:4px}.sheet{padding:12px 6px}.sheet-head{display:block}.source{display:inline-block;margin-top:7px}.std{font-size:12px}.std th,.std td{padding:7px}.opt{font-size:15px;padding:13px 10px}.foot-actions{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="eyebrow">公害防止管理者 水質第1種｜基準値暗記専用</div><h1>環境基準・排水基準・排出基準　表の3択穴埋め</h1><p>環境省の公表表を参考に、数値を「表の位置」と一緒に覚える独立教材です。</p></header>
<div class="notice"><b>現行基準：</b>2026年9月5日時点の環境省公表資料を照合。既存200問演習とは学習履歴も別に保存します。</div>
<div class="toolbar"><div><div class="label">学習する表</div><select id="group" class="select"></select></div><div class="mode"><button id="quizMode" class="active">穴埋め演習</button><button id="studyMode">一覧学習</button></div></div>
<div class="stats"><div class="stat"><b id="answered">0</b><span>解答セル</span></div><div class="stat"><b id="correct">0</b><span>正解</span></div><div class="stat"><b id="rate">—</b><span>正答率</span></div></div>
<section class="sheet" id="sheet"><div class="sheet-head"><div><h2 id="title"></h2><div class="subtext" id="subtitle"></div></div><a id="source" class="source" target="_blank" rel="noopener">環境省 原表</a></div><div class="table-scroll"><table class="std" id="table"></table></div><div class="legend" id="legend"></div><div class="question"><div class="qline" id="qline"></div><div class="options" id="options"></div><div class="result" id="result"></div><button class="next" id="next">次の空欄へ</button></div><div class="study-note" id="memo"></div><div class="foot-actions"><button id="weak">苦手セルを優先：OFF</button><button id="reset">この教材の履歴をリセット</button></div></section>
</div>
<script src="./standards-drill-data-v1.js?v=2"></script>
<script>
(function(){'use strict';
const KEY='water1_standards_drill_v1',G=window.STANDARDS_TABLES||[],$=id=>document.getElementById(id);let state=load(),mode='quiz',gi=0,current=null,answered=false,weak=false,queue=[];
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{h:{}}}catch(e){return{h:{}}}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
for(const g of G)g.rows=g.rows.map(r=>{const o={};g.cols.forEach((c,i)=>o[c[0]]=r[i]);return o});function keyOf(g,r,c){return g.id+'|'+r+'|'+c}function col(g,k){return g.cols.find(c=>c[0]===k)}
function cells(g){const a=[];g.rows.forEach((r,ri)=>g.cols.forEach(c=>{if(c[2]&&String(r[c[0]])!=='—')a.push({ri,ck:c[0]})}));return a}function refill(){const g=G[gi],a=cells(g);if(!weak){queue=shuffled(a);return}let w=[];a.forEach(x=>{const h=state.h[keyOf(g,x.ri,x.ck)]||{a:0,c:0},n=h.a?Math.max(1,1+(h.a-h.c)*2):2;for(let i=0;i<n;i++)w.push(x)});queue=shuffled(w)}
function nextQ(){if(!queue.length)refill();current=queue.pop();answered=false;render()}function optionValues(g,q){const ans=g.rows[q.ri][q.ck],c=col(g,q.ck);let p=[];if(g.pools&&g.pools[q.ck])p.push(...g.pools[q.ck]);g.rows.forEach(r=>p.push(r[q.ck]));p=[...new Set(p.filter(v=>v&&v!=='—'&&v!==ans))];p=shuffled(p).slice(0,2);for(const x of ['0.01 mg/L以下','0.1 mg/L以下','1 mg/L以下','10 mg/L以下','検出されないこと'])if(x!==ans&&!p.includes(x)&&p.length<2)p.push(x);return shuffled([ans,...p])}
function stats(){let a=0,c=0;Object.values(state.h).forEach(x=>{a+=x.a||0;c+=x.c||0});$('answered').textContent=a;$('correct').textContent=c;$('rate').textContent=a?Math.round(c/a*100)+'%':'—'}
function tableHTML(showAnswer){const g=G[gi];let h='<thead><tr>';g.cols.forEach(c=>h+='<th>'+esc(c[1])+'</th>');h+='</tr></thead><tbody>';g.rows.forEach((r,ri)=>{h+='<tr'+(current&&mode==='quiz'&&ri===current.ri?' class="target-row"':'')+'>';g.cols.forEach((c,ci)=>{const t=mode==='quiz'&&current&&ri===current.ri&&c[0]===current.ck;let v=r[c[0]],cl='';if(t&&!showAnswer)v='<span class="blank">？</span>';if(t&&showAnswer)cl=' class="correct-cell"';h+=(ci===0?'<th':'<td')+cl+'>'+(t&&!showAnswer?v:esc(v))+(ci===0?'</th>':'</td>')});h+='</tr>'});return h+'</tbody>'}
function render(){if(!G.length){$('title').textContent='データを読み込めませんでした';return}const g=G[gi];$('title').textContent=g.title;$('subtitle').textContent=g.sub;$('source').href=g.src;$('memo').textContent='覚え方：'+g.memo;$('sheet').classList.toggle('allmode',mode==='study');$('table').innerHTML=tableHTML(mode==='study');$('legend').textContent=mode==='study'?'一覧学習モード：数値の並びを表の位置ごと確認してください。':'黄色の「？」セルに入る基準値を3択から選んでください。';if(mode==='quiz'&&current){const r=g.rows[current.ri],c=col(g,current.ck);$('qline').textContent='「'+r.item+'」の「'+c[1]+'」に入るものは？';$('options').innerHTML=optionValues(g,current).map(v=>'<button class="opt" data-v="'+esc(v)+'">'+esc(v)+'</button>').join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.v));$('result').className='result';$('result').innerHTML='';$('next').className='next'}stats()}
function answer(v){if(answered)return;answered=true;const g=G[gi],ans=g.rows[current.ri][current.ck],k=keyOf(g,current.ri,current.ck),h=state.h[k]||(state.h[k]={a:0,c:0});h.a++;if(v===ans)h.c++;save();document.querySelectorAll('.opt').forEach(b=>{if(b.dataset.v===ans)b.classList.add('good');else if(b.dataset.v===v)b.classList.add('bad');b.disabled=true});const ok=v===ans;$('result').className='result show '+(ok?'good':'bad');$('result').innerHTML='<b>'+(ok?'✓ 正解':'✕ 不正解')+'</b><br>正答：'+esc(ans);$('next').className='next show';$('table').innerHTML=tableHTML(true);stats()}
$('group').innerHTML=G.map((g,i)=>'<option value="'+i+'">'+esc(g.title)+'</option>').join('');$('group').onchange=e=>{gi=+e.target.value;refill();mode==='quiz'?nextQ():render()};$('quizMode').onclick=()=>{mode='quiz';$('quizMode').classList.add('active');$('studyMode').classList.remove('active');refill();nextQ()};$('studyMode').onclick=()=>{mode='study';$('studyMode').classList.add('active');$('quizMode').classList.remove('active');render()};$('next').onclick=nextQ;$('weak').onclick=()=>{weak=!weak;$('weak').textContent='苦手セルを優先：'+(weak?'ON':'OFF');refill();if(mode==='quiz')nextQ()};$('reset').onclick=()=>{if(confirm('この基準値教材の解答履歴だけをリセットします。既存200問の履歴には影響しません。')){state={h:{}};save();refill();mode==='quiz'?nextQ():render()}};refill();nextQ();
})();
</script>
</body></html>
