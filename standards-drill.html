for(const g of G){g.rows=g.rows.map(r=>{const o={};g.cols.forEach((c,i)=>o[c[0]]=r[i]);return o})}
const $=id=>document.getElementById(id);let state=load(),mode='quiz',gi=0,current=null,answered=false,weak=false,queue=[];
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{h:{}}}catch(e){return{h:{}}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function keyOf(g,r,c){return g.id+'|'+r+'|'+c}
function quizCells(g){const a=[];g.rows.forEach((r,ri)=>g.cols.forEach(c=>{if(c[2]&&String(r[c[0]])!=='—')a.push({ri,ck:c[0]})}));return a}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function refill(){const g=G[gi],cells=quizCells(g);if(weak){const weighted=[];cells.forEach(x=>{const h=state.h[keyOf(g,x.ri,x.ck)]||{a:0,c:0};const w=h.a?Math.max(1,1+(h.a-h.c)*2):2;for(let i=0;i<w;i++)weighted.push(x)});queue=shuffled(weighted)}else queue=shuffled(cells)}
function nextQ(){if(!queue.length)refill();current=queue.pop();answered=false;render()}
function col(g,k){return g.cols.find(c=>c[0]===k)}
function opts(g,q){const correct=g.rows[q.ri][q.ck],c=col(g,q.ck);let pool=[];if(g.pools&&g.pools[q.ck])pool=pool.concat(g.pools[q.ck]);g.rows.forEach(r=>pool.push(r[q.ck]));pool=[...new Set(pool.filter(v=>v&&v!=='—'&&v!==correct))];pool=shuffled(pool).slice(0,2);if(pool.length<2){const fallback=['0.01 mg/L以下','0.1 mg/L以下','1 mg/L以下','10 mg/L以下','検出されないこと','日平均100 mg/L'];for(const x of fallback)if(x!==correct&&!pool.includes(x)&&pool.length<2)pool.push(x)}return shuffled([correct,...pool])}
function stats(){let a=0,c=0;Object.values(state.h).forEach(x=>{a+=x.a||0;c+=x.c||0});$('answered').textContent=a;$('correct').textContent=c;$('rate').textContent=a?Math.round(c/a*100)+'%':'—'}
function render(){const g=G[gi];$('title').textContent=g.title;$('subtitle').textContent=g.sub;$('source').href=g.src;$('memo').textContent='覚え方：'+g.memo;$('sheet').classList.toggle('allmode',mode==='study');let h='<thead><tr>';g.cols.forEach(c=>h+='<th>'+esc(c[1])+'</th>');h+='</tr></thead><tbody>';g.rows.forEach((r,ri)=>{const tr=current&&mode==='quiz'&&ri===current.ri?' class="target-row"':'';h+='<tr'+tr+'>';g.cols.forEach((c,ci)=>{let v=r[c[0]],klass='';if(mode==='quiz'&&current&&ri===current.ri&&c[0]===current.ck){if(answered){klass=' class="correct-cell"'}else v='<span class="blank">？</span>'}h+=(ci===0?'<th'+klass+'>':'<td'+klass+'>')+(String(v).includes('<span')?v:esc(v))+(ci===0?'</th>':'</td>')});h+='</tr>'});h+='</tbody>';$('table').innerHTML=h;$('legend').textContent=mode==='study'?'一覧学習モード：数値の並びを表の位置ごと確認してください。':'黄色の「？」セルに入る基準値を3択から選んでください。';if(mode==='quiz'&&current){const c=col(g,current.ck),r=g.rows[current.ri];$('qline').textContent='「'+r.item+'」の「'+c[1]+'」に入るものは？';const os=opts(g,current);$('options').innerHTML=os.map(v=>'<button class="opt" data-v="'+attr(v)+'">'+esc(v)+'</button>').join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.v));$('result').className='result';$('result').innerHTML='';$('next').className='next';}stats()}
function answer(v){if(answered)return;answered=true;const g=G[gi],correct=g.rows[current.ri][current.ck],k=keyOf(g,current.ri,current.ck),h=state.h[k]||(state.h[k]={a:0,c:0});h.a++;if(v===correct)h.c++;save();document.querySelectorAll('.opt').forEach(b=>{if(b.dataset.v===correct)b.classList.add('good');else if(b.dataset.v===v)b.classList.add('bad');b.disabled=true});const ok=v===correct;$('result').className='result show '+(ok?'good':'bad');$('result').innerHTML='<b>'+(ok?'✓ 正解':'✕ 不正解')+'</b><br>正答：'+esc(correct);$('next').className='next show';renderTableAfterAnswer();stats()}
function renderTableAfterAnswer(){const g=G[gi];let h='<thead><tr>';g.cols.forEach(c=>h+='<th>'+esc(c[1])+'</th>');h+='</tr></thead><tbody>';g.rows.forEach((r,ri)=>{h+='<tr'+(ri===current.ri?' class="target-row"':'')+'>';g.cols.forEach((c,ci)=>{const target=ri===current.ri&&c[0]===current.ck;h+=(ci===0?'<th':'<td')+(target?' class="correct-cell"':'')+'>'+esc(r[c[0]])+(ci===0?'</th>':'</td>')});h+='</tr>'});$('table').innerHTML=h+'</tbody>'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function attr(s){return esc(s)}
$('group').innerHTML=G.map((g,i)=>'<option value="'+i+'">'+esc(g.title)+'</option>').join('');$('group').onchange=e=>{gi=+e.target.value;refill();if(mode==='quiz')nextQ();else render()};$('quizMode').onclick=()=>{mode='quiz';$('quizMode').classList.add('active');$('studyMode').classList.remove('active');refill();nextQ()};$('studyMode').onclick=()=>{mode='study';$('studyMode').classList.add('active');$('quizMode').classList.remove('active');render()};$('next').onclick=nextQ;$('weak').onclick=()=>{weak=!weak;$('weak').textContent='苦手セルを優先：'+(weak?'ON':'OFF');refill();if(mode==='quiz')nextQ()};$('reset').onclick=()=>{if(confirm('この基準値教材の解答履歴だけをリセットします。既存200問の履歴には影響しません。')){state={h:{}};save();stats();refill();if(mode==='quiz')nextQ()}};refill();nextQ();
})();
