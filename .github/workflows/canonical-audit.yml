name: Canonical audit
on:
  push:
    paths:
      - 'qbank_*.js'
      - 'visual_aid_audit_v53.js'
      - 'visual_aid_audit_v53.json'
      - 'ui_polish_v46.js'
      - 'standards-drill.html'
      - 'standards-drill-data-v1.js'
      - 'advanced-treatment-analysis.html'
      - 'glossary-v5.html'
      - 'glossary-v5*.js'
      - 'tools/canonical_audit_v22.js'
      - 'tools/batch12_final200_audit_v32.js'
      - 'tools/chemical_formula_audit_v33.js'
      - 'tools/exam_difficulty_signal_report_v34.js'
      - 'tools/exam_quality_audit_v34.js'
      - 'tools/visual_semantics_audit_v35.js'
      - 'tools/unit_typography_audit_v36.js'
      - 'tools/choice_logic_redundancy_audit_v38.js'
      - 'tools/content_restructure_audit_v39.js'
      - 'tools/full_bank_semantic_review_v41.json'
      - 'tools/full_bank_semantic_review_audit_v41.js'
      - 'tools/semantic_upgrade_audit_v42.js'
      - 'tools/semantic_final_audit_v43.js'
      - 'tools/exam_difficulty_stage1_audit_v47.js'
      - 'tools/exam_difficulty_stage2_audit_v48.js'
      - 'tools/exam_difficulty_stage3_audit_v49.js'
      - 'tools/exam_difficulty_stage4_audit_v50.js'
      - 'tools/exam_difficulty_stage5_audit_v51.js'
      - 'tools/learning_visuals_audit_v52.js'
      - 'tools/visual_aid_audit_v53.js'
      - 'tools/standards_drill_audit_v1.js'
      - 'tools/standards_mobile_layout_audit_v2.js'
      - 'tools/advanced_treatment_analysis_audit_v1.js'
      - 'tools/glossary_v5_audit_v1.js'
      - 'tools/ui_release_audit_v46.js'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.js'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/canonical-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run canonical gap audit
        run: node tools/canonical_audit_v22.js
      - name: Run Batch 12 final 200-question quality and UI regression audit
        run: node tools/batch12_final200_audit_v32.js
      - name: Run full-bank chemical formula rendering audit
        run: node tools/chemical_formula_audit_v33.js
      - name: Report exam difficulty signals
        run: node tools/exam_difficulty_signal_report_v34.js
      - name: Run exam realism and duplicate enrichment audit
        run: node tools/exam_quality_audit_v34.js
      - name: Run full visual semantics audit
        run: node tools/visual_semantics_audit_v35.js
      - name: Run unit typography regression audit
        run: node tools/unit_typography_audit_v36.js
      - name: Report post-restructure three-criteria candidates
        run: node tools/choice_logic_redundancy_audit_v38.js | tee choice_logic_report_v38.txt
      - name: Upload three-criteria audit report
        uses: actions/upload-artifact@v4
        with:
          name: choice-logic-report-v38
          path: |
            choice_logic_report_v38.txt
            choice_logic_bank_v38.json
          if-no-files-found: error
      - name: Run v39 content restructure regression audit
        run: node tools/content_restructure_audit_v39.js
      - name: Run full-bank semantic review coverage v41
        run: node tools/full_bank_semantic_review_audit_v41.js
      - name: Run v42 semantic rewrite and strengthening audit
        run: node tools/semantic_upgrade_audit_v42.js
      - name: Run final all-bank semantic quality audit v45
        run: node tools/semantic_final_audit_v43.js
      - name: Run stage 1 large-water exam difficulty uplift audit v47
        run: node tools/exam_difficulty_stage1_audit_v47.js
      - name: Run stage 2 wastewater-treatment exam difficulty uplift audit v48
        run: node tools/exam_difficulty_stage2_audit_v48.js
      - name: Run stage 3 hazardous-substance exam difficulty uplift audit v49
        run: node tools/exam_difficulty_stage3_audit_v49.js
      - name: Run stage 4 water-overview exam difficulty uplift audit v50
        run: node tools/exam_difficulty_stage4_audit_v50.js
      - name: Run stage 5 pollution-general exam difficulty uplift audit v51
        run: node tools/exam_difficulty_stage5_audit_v51.js
      - name: Run v52 formula and explanation-flow audit
        run: node tools/learning_visuals_audit_v52.js
      - name: Run v53 all-question visual-aid audit
        run: node tools/visual_aid_audit_v53.js
      - name: Run standards table fill-in drill audit
        run: node tools/standards_drill_audit_v1.js
      - name: Run mobile standards table layout audit
        run: node tools/standards_mobile_layout_audit_v2.js
      - name: Run advanced treatment and analysis browser drill audit
        run: node tools/advanced_treatment_analysis_audit_v1.js
      - name: Run glossary v5 data/search/reverse-jump regression audit
        run: node tools/glossary_v5_audit_v1.js
      - name: Run v46 UI and service-worker static audit
        run: node tools/ui_release_audit_v46.js
      - name: Install E2E dependencies
        run: npm install --no-fund --no-audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile browser E2E
        run: npm run test:e2e
