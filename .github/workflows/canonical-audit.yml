name: Canonical audit
on:
  push:
    paths:
      - 'qbank_*.js'
      - 'tools/canonical_audit_v22.js'
      - 'tools/batch11_static_audit_v31.js'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/canonical-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run canonical gap audit
        run: node tools/canonical_audit_v22.js
      - name: Run Batch 11 static quality and UI regression audit
        run: node tools/batch11_static_audit_v31.js
