name: Canonical audit
on:
  push:
    paths:
      - 'qbank_*.js'
      - 'tools/canonical_audit_v22.js'
      - 'tools/batch9_static_audit_v23.js'
      - 'tools/canonical_material_coverage_v25.js'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/canonical-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run canonical gap audit
        run: node tools/canonical_audit_v22.js
      - name: Run Batch 9 static quality regression audit
        run: node tools/batch9_static_audit_v23.js
      - name: Audit existing teaching coverage for top 15
        run: node tools/canonical_material_coverage_v25.js
