name: Canonical audit
on:
  push:
    paths:
      - 'qbank_*.js'
      - 'standards-drill.html'
      - 'standards-drill-data-v1.js'
      - 'tools/canonical_audit_v22.js'
      - 'tools/batch12_final200_audit_v32.js'
      - 'tools/chemical_formula_audit_v33.js'
      - 'tools/exam_difficulty_signal_report_v34.js'
      - 'tools/standards_drill_audit_v1.js'
      - 'tools/standards_mobile_layout_audit_v2.js'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/canonical-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run canonical gap audit
        run: node tools/canonical_audit_v22.js
      - name: Run Batch 12 final 200-question quality and UI regression audit
        run: node tools/batch12_final200_audit_v32.js
      - name: Run full-bank chemical formula rendering audit
        run: node tools/chemical_formula_audit_v33.js
      - name: Report exam difficulty signals
        run: node tools/exam_difficulty_signal_report_v34.js
      - name: Run standards table fill-in drill audit
        run: node tools/standards_drill_audit_v1.js
      - name: Run mobile standards table layout audit
        run: node tools/standards_mobile_layout_audit_v2.js
