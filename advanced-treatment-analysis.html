lass="s" x="654" y="270" text-anchor="middle">減容・安定化・灰利用</text></svg>`,

let S={idx:0,hist:{},total:0,correct:0};

function pick(i){const x=Q[S.idx],h=S.hist[x.id]||{attempts:0,correct:0,wrong:0};h.attempts++;S.total++;if(i===x.a){h.correct++;S.correct++}else h.wrong++;S.hist[x.id]=h;save();const btns=[...document.querySelectorAll('.choice')];btns.forEach((b,j)=>{b.disabled=false;b.onclick=()=>toggleExp(j);if(j===x.a)b.classList.add('good');if(j===i&&i!==x.a)b.classList.add('bad')});const r=el('result');r.style.display='block';r.innerHTML=`<h3 class="${i===x.a?'ok':'ng'}">${i===x.a?'✓ 正解':'✕ 不正解'}</h3><div>正答：${x.a+1}</div><div class="deep"><b>この問題の核心</b><br>${x.core}<div class="reaction">${x.reaction}</div></div>`;renderParts(x);el('openall').disabled=false;el('next').style.display='block';stats();r.scrollIntoView({behavior:'smooth',block:'start'})}
function toggleExp(i){const d=el('e'+i);d.style.display=d.style.display==='block'?'none':'block'}
